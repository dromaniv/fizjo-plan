name: Tests and dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Test Python and Apps Script
        run: |
          python -m py_compile main.py
          python -m unittest discover -s tests -v
          node --test tests/test_sync.cjs
      - name: Audit locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" --disable-pip --no-deps -r requirements.txt
