name: Update Schedules

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Test generation and sync safeguards
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_sync.cjs
      - name: Generate complete calendars
        run: python main.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calendar-feeds
          path: docs/*.ics
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-feeds
          path: ${{ runner.temp }}/calendar-feeds
      # Do not install dependencies or execute generated files in this job.
      - name: Copy calendar data
        env:
          FEED_DIR: ${{ runner.temp }}/calendar-feeds
        run: |
          shopt -s nullglob
          files=("$FEED_DIR"/*.ics)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No calendar artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            name="${file##*/}"
            if [[ ! "$name" =~ ^[A-Za-z0-9_-]+\.ics$ || ! -f "$file" || -L "$file" ]]; then
              echo "::error::Invalid calendar artifact"
              exit 1
            fi
            if [[ $(wc -c < "$file") -gt 2097152 ]]; then
              echo "::error::Calendar artifact exceeds the size limit"
              exit 1
            fi
            cp -- "$file" "docs/$name"
          done
      - name: Commit and push calendars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -- docs/*.ics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Auto-update schedules [skip ci]"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
