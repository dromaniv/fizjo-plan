name: Update Schedules

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml icalendar pytz

      - name: Run the schedule script
        run: |
          echo "➡️ Running main.py ..."
          python main.py || echo "⚠️ main.py failed"

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f docs/*.ics
          git commit -m "Auto-update schedules [skip ci]" || echo "No changes"
          git push
